<section class="nds-hero-section" aria-label="قسم العرض الرئيسي">
    <div class="nds-swiper nds-hero nds-oncolor nds-full-width" style="--total: 1">
        <div class="nds-swiper-wrapper">
            <div class="nds-swiper-slide nds-content-wrapper">
                <div class="nds-hero-image-wrapper"
                    style="--overlay:0.7; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                    <picture>
                        <source media="(max-width: 768px)" srcset="assets/img/riyadhcenter3s.webp">
                        <img src="assets/img/riyadhcenter_ai.webp" class="nds-hero-image" alt=""
                            style="width: 100%; height: 100%; object-fit: cover; object-position: center 80%; display: block;"
                            fetchpriority="high">
                    </picture>
                </div>
                <div class="nds-section-body">
                    <h1 class="nds-section-title">Vanilla Design System</h1>
                    <p class="nds-section-description">An open-source, vanilla implementation of Saudi Arabia's National Design System. Production-ready HTML, CSS, and JavaScript built from scratch with zero dependencies.</p>
                    <div style="display:flex;gap:var(--spacing-md);flex-wrap:wrap;">
                      <a href="https://github.com/mazin-musleh/NDS-vanilla" target="_blank" rel="noopener" class="nds-btn nds-primary nds-oncolor nds-lg nds-external"><i class="hgi hgi-stroke hgi-github"></i><span class="nds-label">View on GitHub</span></a>
                      <a href="https://github.com/mazin-musleh/NDS-vanilla/releases/latest" target="_blank" rel="noopener" class="nds-btn nds-secondary-outline nds-oncolor nds-lg nds-external"><span class="nds-label">Download</span></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="nds-swiper-navigation">
            <div class="nds-swiper-buttons">
                <button class="nds-btn nds-subtle nds-icon-only nds-oncolor nds-prev"
                    aria-label="Previous slide" hidden></button>
                <button class="nds-btn nds-subtle nds-icon-only nds-oncolor nds-next"
                    aria-label="Next slide" hidden></button>
            </div>
            <div class="nds-swiper-pagination" hidden></div>
        </div>
    </div>
</section>
