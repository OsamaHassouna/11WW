<!--
    FOOTER
    .nds-green is the stock DGA footer treatment. Alternatives documented in
    reference/ui-shell/footer.html: nds-primary, nds-neutral, nds-brand.

    The [hidden] attribute is deliberate. NDS reveals the footer in a single
    batch after init to avoid a layout shift, and js/site.js does the same for
    this starter. Leave it on.

    GOVERNMENT MARKS
    The three logos in .nds-footer-logos (national emblem, AI 2026, Vision
    2030) are reserved for Saudi government entities. Remove them for a
    non-government project. See docs/05-audit.md finding 2.
-->
<footer class="nds-footer nds-content-wrapper nds-green" hidden role="contentinfo" aria-label="Site footer">
    <nav class="nds-footer-content" aria-label="Footer navigation">

        <div class="nds-footer-column">
            <h2 class="nds-footer-heading">Main links</h2>
            <ul class="nds-footer-list">
                <li><a class="nds-link nds-footer-link" href="index.html"><span class="nds-label">Home</span></a></li>
                <li><a class="nds-link nds-footer-link" href="pages/content.html"><span class="nds-label">About</span></a></li>
                <li><a class="nds-link nds-footer-link" href="pages/service.html"><span class="nds-label">Services</span></a></li>
                <li><a class="nds-link nds-footer-link" href="pages/form.html"><span class="nds-label">Apply</span></a></li>
            </ul>
        </div>

        <div class="nds-footer-column">
            <h2 class="nds-footer-heading">Support</h2>
            <ul class="nds-footer-list">
                <li><a class="nds-link nds-footer-link" href="#"><i class="nds-icon nds-hgi-headphones" aria-hidden="true"></i><span class="nds-label">Contact us</span></a></li>
                <li><a class="nds-link nds-footer-link" href="#"><i class="nds-icon nds-hgi-help-circle" aria-hidden="true"></i><span class="nds-label">Help centre</span></a></li>
                <li><a class="nds-link nds-footer-link" href="mailto:info@example.gov.sa"><i class="nds-icon nds-hgi-mail-01" aria-hidden="true"></i><span class="nds-label">info@example.gov.sa</span></a></li>
            </ul>
        </div>

        <div class="nds-footer-column nds-footer-icons">
            <div class="nds-footer-icon-group">
                <h2 class="nds-footer-heading">Follow us</h2>
                <div class="nds-footer-icon-row">
                    <a class="nds-btn nds-secondary-outline nds-icon-only" href="#" target="_blank" rel="noopener" aria-label="Follow us on X">
                        <i class="nds-icon nds-hgi-new-twitter" aria-hidden="true"></i>
                    </a>
                    <a class="nds-btn nds-secondary-outline nds-icon-only" href="#" target="_blank" rel="noopener" aria-label="Follow us on LinkedIn">
                        <i class="nds-icon nds-hgi-linkedin-02" aria-hidden="true"></i>
                    </a>
                    <a class="nds-btn nds-secondary-outline nds-icon-only" href="#" target="_blank" rel="noopener" aria-label="Follow us on YouTube">
                        <i class="nds-icon nds-hgi-youtube" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <hr class="nds-divider nds-lg">

    <div class="nds-footer-bottom">
        <div class="nds-footer-meta">
            <div class="nds-footer-links">
                <a class="nds-link" href="#"><span class="nds-label">Accessibility statement</span></a>
                <a class="nds-link" href="#"><span class="nds-label">Open data</span></a>
                <a class="nds-link" href="#"><span class="nds-label">Sitemap</span></a>
            </div>
            <div class="nds-footer-legal">
                <div class="nds-footer-copyright">
                    <span>All rights reserved &copy; <span id="shellYear">2026</span> Entity Name</span>
                </div>
                <div class="nds-footer-policy">
                    <a class="nds-link" href="#"><span class="nds-label">Terms &amp; conditions</span></a>
                    <a class="nds-link" href="#"><span class="nds-label">Privacy policy</span></a>
                </div>
            </div>
        </div>

        <!-- Government marks. Remove for non-government projects. -->
        <div class="nds-footer-logos">
            <a href="index.html">
                <img class="nds-oncolor" src="assets/img/palm_swords.svg" loading="lazy" width="40" height="40" alt="Entity logo">
            </a>
            <a href="https://www.vision2030.gov.sa/" target="_blank" rel="nofollow noopener">
                <img class="nds-oncolor" src="assets/img/2030-vision.svg" loading="lazy" width="60" height="40" alt="Saudi Vision 2030">
            </a>
        </div>
    </div>

    <script>
        (function () {
            var y = document.getElementById('shellYear');
            if (y) y.textContent = new Date().getFullYear();
        })();
    </script>
</footer>
